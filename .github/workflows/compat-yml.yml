# One-off: hand ≤1.7.5 clients their `latest*.yml` for the current release.
#
# Those clients use electron-updater, which looks for latest.yml in the *newest*
# release only. The 1.7.6 bridge was generated by hand; this job redoes it from
# the 1.7.6 files as a template, so the schema is theirs and only the version,
# names, sizes and sha512 change. Delete this workflow once no ≤1.7.5 client is
# left (same lifetime as the ModelPort-Shell alias in release.yml).
name: Compat update ymls (one-off)

on:
  workflow_dispatch:

jobs:
  yml:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Generate bridge ymls from the 1.7.6 template and upload
        run: |
          set -euo pipefail
          mkdir -p tmpl dist out
          gh release download v1.7.6 -R polite0803/ModelPort -p 'latest*.yml' -D tmpl
          node - <<'JS'
          const fs = require('node:fs')
          const crypto = require('node:crypto')
          const { execFileSync } = require('node:child_process')
          const REPO = 'polite0803/ModelPort'
          const FROM = '1.7.6'
          const TO = '1.7.7'

          const gh = (...args) => execFileSync('gh', args, { encoding: 'utf8' })

          const templates = fs.readdirSync('tmpl').filter((f) => f.endsWith('.yml'))
          if (templates.length === 0) throw new Error('no template ymls')

          // Every asset the templates mention, renamed to this release.
          const wanted = new Set()
          for (const file of templates) {
            for (const line of fs.readFileSync(`tmpl/${file}`, 'utf8').split('\n')) {
              const m = line.match(/^\s*(?:-\s*)?(?:url|path):\s*(\S+)\s*$/)
              if (m) wanted.add(m[1].replaceAll(FROM, TO))
            }
          }
          console.log('assets:', [...wanted].join(', '))

          const info = new Map()
          for (const name of wanted) {
            gh('release', 'download', `v${TO}`, '-R', REPO, '-p', name, '-D', 'dist')
            gh('release', 'download', `v${TO}`, '-R', REPO, '-p', `${name}.sha256`, '-D', 'dist')
            const bytes = fs.readFileSync(`dist/${name}`)
            const sha512 = crypto.createHash('sha512').update(bytes).digest('base64')
            const sha256 = crypto.createHash('sha256').update(bytes).digest('hex')
            const published = fs.readFileSync(`dist/${name}.sha256`, 'utf8').trim().split(/\s+/)[0]
            if (sha256 !== published) throw new Error(`${name}: sha256 mismatch, refusing to write a yml`)
            info.set(name, { sha512, size: bytes.length })
            console.log(`${name}: sha512 ok (${bytes.length} bytes)`)
          }

          for (const file of templates) {
            const lines = fs.readFileSync(`tmpl/${file}`, 'utf8').split('\n')
            const out = []
            let current = null
            let primary = null
            for (const line of lines) {
              let next = line
              const url = line.match(/^\s*-\s*url:\s*(\S+)\s*$/)
              if (url) {
                current = url[1].replaceAll(FROM, TO)
                next = line.replace(url[1], current)
                if (primary === null) primary = current
              } else if (/^\s*sha512:/.test(line) && current !== null) {
                next = `${line.match(/^\s*/)[0]}sha512: ${info.get(current).sha512}`
              } else if (/^\s*size:/.test(line) && current !== null) {
                next = `${line.match(/^\s*/)[0]}size: ${info.get(current).size}`
              } else if (/^path:/.test(line)) {
                next = `path: ${primary}`
              } else if (/^sha512:/.test(line)) {
                next = `sha512: ${info.get(primary).sha512}`
              } else if (/^version:/.test(line)) {
                next = `version: ${TO}`
              } else if (/^releaseDate:/.test(line)) {
                next = `releaseDate: '${new Date().toISOString()}'`
              }
              out.push(next)
            }
            fs.writeFileSync(`out/${file}`, out.join('\n'))
            console.log(`--- ${file} ---`)
            console.log(out.join('\n'))
          }
          JS
          gh release upload v1.7.7 -R polite0803/ModelPort out/*.yml --clobber
          gh release view v1.7.7 -R polite0803/ModelPort --json assets --jq '.assets | length'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
