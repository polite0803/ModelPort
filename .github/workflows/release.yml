name: Release

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*'

# 同一个标签不叠两次发布：`cancel-in-progress: false` 是故意的 —— 半途取消正在上传
# 产物的运行，正是 Releases 留下半套 draft 的来源；第二次推送会排在后面而不是打断它。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 发布前必须先过门禁。原来 tag 一推就直接 `electron-builder --publish=always`，
  # 也就是一个没跑过类型检查与测试的构建可以被发到 Releases —— CI 的结果完全不参与发布判定。
  gate:
    name: Gate before publish (build + typecheck + test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 与 ci.yml 同版本。构建侧原来固定 Node 20，而门禁要求 22.6+ 的原生
          # type stripping：版本不一致会把「门禁能发现的失败」留到发布产物里。
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/

      - name: Verify Node runtime
        run: node scripts/check-node-version.mjs

      - name: Run gate (source artifacts + build + typecheck + test)
        run: npm run gate
        env:
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/

  release:
    needs: gate
    runs-on: ${{ matrix.os }}
    # macOS runner 是这里最稀缺的一档：给它一个明确的上限，拿不到就红，不要静默挂着
    timeout-minutes: 45
    permissions:
      contents: write
      # `actions: write` 对本流程没有任何必要（不触发也不读取别的 workflow），
      # 留着只会放大凭据泄露后的影响面。

    strategy:
      matrix:
        include:
          - os: macos-latest
            arch: arm64
          - os: macos-latest
            arch: x64
          - os: windows-latest
            arch: x64
          - os: ubuntu-latest
            arch: x64
          - os: ubuntu-latest
            arch: arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/

      - name: Build application
        run: npm run build

      - name: Build and Publish (macOS)
        if: matrix.os == 'macos-latest'
        run: npx electron-builder --mac --${{ matrix.arch }} --publish=always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/

      - name: Build and Publish (Windows)
        if: matrix.os == 'windows-latest'
        run: npx electron-builder --win --${{ matrix.arch }} --publish=always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/

      - name: Build and Publish (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: npx electron-builder --linux --${{ matrix.arch }} --publish=always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
