name: Release

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*'

jobs:
  # 发布前必须先过门禁。原来 tag 一推就直接 `electron-builder --publish=always`，
  # 也就是一个没跑过类型检查与测试的构建可以被发到 Releases —— CI 的结果完全不参与发布判定。
  gate:
    name: Gate before publish (build + typecheck + test)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 与 ci.yml 同源（.nvmrc）。构建侧原来固定 Node 20，而门禁要求 22.6+
          # 的原生 type stripping：版本不一致会把「门禁能发现的失败」留到发布产物里。
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/

      - name: Verify Node runtime
        run: node scripts/check-node-version.mjs

      - name: Run gate (source artifacts + build + typecheck + test)
        run: npm run gate
        env:
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/

  # 说明：产物均未签名、未公证；macOS 只发布 dmg（没有 zip 更新源，electron-updater
  # 在 macOS 上不可用），Windows/Linux 产物也未做代码签名。平台矩阵改动前请先核对
  # package.json 的 build 目标与 README 的产物表。
  release:
    needs: gate
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      # `actions: write` 对本流程没有任何必要（不触发也不读取别的 workflow），
      # 留着只会放大凭据泄露后的影响面。

    strategy:
      matrix:
        include:
          - os: macos-latest
            arch: arm64
          - os: macos-latest
            arch: x64
          - os: windows-latest
            arch: x64
          - os: ubuntu-latest
            arch: x64
          - os: ubuntu-latest
            arch: arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/

      # 发布包必须携带“当次抓取”的内置快照：脚本失败会输出 ::warning:: 并以 0 退出，
      # 保留已提交的旧快照；`continue-on-error` 再兜底脚本自身异常，不阻断发布。
      # 普通 `npm run build` 不依赖网络，本地断网构建不受影响。
      - name: Refresh built-in catalogue snapshot (release only)
        continue-on-error: true
        run: npm run build:builtin-catalog

      - name: Build application
        run: npm run build

      - name: Build and Publish (macOS)
        if: matrix.os == 'macos-latest'
        run: npx electron-builder --mac --${{ matrix.arch }} --publish=always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/

      - name: Build and Publish (Windows)
        if: matrix.os == 'windows-latest'
        run: npx electron-builder --win --${{ matrix.arch }} --publish=always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/

      # 壳：同一次 Release 的第二个 Windows 产物。刻意**不用** `--publish=always`——
      # electron-builder 的 Windows 更新描述文件名固定 `latest.yml`，两个产品都发就会互相
      # 覆盖，主程序的自动更新会开始下载壳的二进制。所以这里只构建，再用 gh 传 exe 本体，
      # 一个 yml 都不上传（壳也不带 electron-updater）。
      - name: Build and upload the Windows shell (no updater metadata)
        if: matrix.os == 'windows-latest' && matrix.arch == 'x64'
        run: |
          npx electron-builder -c electron-builder.shell.yml --win --x64
          gh release upload "${{ github.ref_name }}" dist-shell/ModelPort-Shell-*-*-setup.exe --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/

      - name: Build and Publish (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: npx electron-builder --linux --${{ matrix.arch }} --publish=always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/

      # 无头守护进程：给 WSL / 容器 / 没有显示环境的 Linux 主机。产物是 tar.gz
      # （bundle + resources + renderer + systemd unit 模板），不带 Electron 运行时。
      - name: Package and upload the headless daemon
        if: matrix.os == 'ubuntu-latest'
        run: |
          npm run build:daemon
          gh release upload "${{ github.ref_name }}" dist/modelport-daemon-*-${{ matrix.arch }}.tar.gz --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
