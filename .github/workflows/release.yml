name: Release

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*'

jobs:
  # 发布前必须先过门禁。原来 tag 一推就直接 `electron-builder --publish=always`，
  # 也就是一个没跑过类型检查与测试的构建可以被发到 Releases —— CI 的结果完全不参与发布判定。
  gate:
    name: Gate before publish (build + typecheck + test)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 与 ci.yml 同源（.nvmrc）。构建侧原来固定 Node 20，而门禁要求 22.6+
          # 的原生 type stripping：版本不一致会把「门禁能发现的失败」留到发布产物里。
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/

      - name: Verify Node runtime
        run: node scripts/check-node-version.mjs

      - name: Run gate (source artifacts + build + typecheck + test)
        run: npm run gate
        env:
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/

  # 说明：产物均未签名、未公证；macOS 只发布 dmg（没有 zip 更新源，electron-updater
  # 在 macOS 上不可用），Windows/Linux 产物也未做代码签名。平台矩阵改动前请先核对
  # package.json 的 build 目标与 README 的产物表。
  release:
    needs: gate
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      # `actions: write` 对本流程没有任何必要（不触发也不读取别的 workflow），
      # 留着只会放大凭据泄露后的影响面。

    strategy:
      matrix:
        include:
          - os: macos-latest
            arch: arm64
          - os: macos-latest
            arch: x64
          - os: windows-latest
            arch: x64
          - os: ubuntu-latest
            arch: x64
          - os: ubuntu-latest
            arch: arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/

      # 发布包必须携带“当次抓取”的内置快照：脚本失败会输出 ::warning:: 并以 0 退出，
      # 保留已提交的旧快照；`continue-on-error` 再兜底脚本自身异常，不阻断发布。
      # 普通 `npm run build` 不依赖网络，本地断网构建不受影响。
      - name: Refresh built-in catalogue snapshot (release only)
        continue-on-error: true
        run: npm run build:builtin-catalog

      - name: Build application
        run: npm run build

      - name: Package the console (macOS)
        if: matrix.os == 'macos-latest'
        run: npx electron-builder --mac --${{ matrix.arch }} --publish=never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/

      - name: Package the console (Windows)
        if: matrix.os == 'windows-latest'
        run: npx electron-builder --win --${{ matrix.arch }} --publish=never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/

      - name: Package the console (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: npx electron-builder --linux --${{ matrix.arch }} --publish=never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/

      # 无头守护进程：给 WSL / 容器 / 没有显示环境的 Linux 主机。产物是 tar.gz
      # （bundle + resources + renderer + systemd unit 模板），不带 Electron 运行时。
      # 构建脚本用 DAEMON_ARCH 环境变量命名 tarball，与 runner 实际架构无关。
      - name: Package and upload the headless daemon
        if: matrix.os == 'ubuntu-latest'
        run: |
          DAEMON_ARCH="${{ matrix.arch }}" npm run build:daemon
          # The console will not hand this tarball to root
          # without a checksum. Write the basename-only line from inside dist/ so the
          # console's parser can match it to the asset name.
          file=$(ls dist/modelport-daemon-*-${{ matrix.arch }}.tar.gz | head -n 1)
          test -n "$file"
          (cd dist && sha256sum "$(basename "$file")" > "$(basename "$file").sha256")
          gh release upload "${{ github.ref_name }}" "$file" "$file.sha256" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 安装包本体 + 同名校验文件：控制台的在线升级要求 `<asset>.sha256`，缺了会拒绝安装。
      # daemon tarball 由上一行单独上传，这一步的 find 明确排除它，避免同一资产传两次。
      - name: Upload installers with checksums
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          upload=()
          for f in dist/*.exe dist/*.dmg dist/*.AppImage dist/*.deb dist/*.tar.gz; do
            case "$(basename "$f")" in
              modelport-daemon-*) continue ;;
            esac
            upload+=("$f")
          done
          test ${#upload[@]} -gt 0
          for f in "${upload[@]}"; do
            (cd "$(dirname "$f")" && sha256sum "$(basename "$f")" > "$(basename "$f").sha256")
          done
          gh release upload "${{ github.ref_name }}" "${upload[@]}" $(for f in "${upload[@]}"; do echo "$f.sha256"; done) --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
