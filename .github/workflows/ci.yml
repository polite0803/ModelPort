name: CI

on:
  push:
    branches:
      - '**'
    # tag 不触发本流程：`npm version` 造的提交与它的标签是**同一个 commit**，双触发
    # 会让同一次提交跑两遍三平台门禁；而 CI 的矩阵里也有 macos-latest，一次标签推送
    # 于是排起 4 个 macOS 任务（2×CI + 2×Release），Release 的 macOS 构建反而抢不到
    # runner，停在 queued 直到被取消，Releases 只剩半套产物。标签的门禁由
    # release.yml 的 `gate` 负责，口径同为 `npm run gate`。
  pull_request:

jobs:
  gate:
    name: Gate (build + typecheck + test)
    runs-on: ${{ matrix.os }}
    # 没有超时的排队任务只会一直挂着，最后被人手动取消 —— 那读起来像「CI 总是不对」,
    # 而不是「runner 拿不到」。失败要看得见。
    timeout-minutes: 30
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 门禁必须跑在 Node 22.6+；CI 上固定用 24（原生 type stripping，
          # 否则 `node --test tests/**/*.test.ts` 会整片 ERR_UNKNOWN_FILE_EXTENSION）。
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/

      - name: Verify Node runtime
        run: node scripts/check-node-version.mjs

      - name: Run gate (source artifacts + build + typecheck + test)
        run: npm run gate
        env:
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
