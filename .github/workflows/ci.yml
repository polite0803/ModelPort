name: CI

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  pull_request:

jobs:
  gate:
    name: Gate (build + typecheck + test)
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # .nvmrc 固定 24，与 AGENTS.md 的门禁口径一致；本地最低版本见 package.json
          # 的 engines（>= 22.18）。门禁依赖 Node 原生 type stripping，否则
          # `node --test tests/**/*.test.ts` 会整片 ERR_UNKNOWN_FILE_EXTENSION。
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/

      - name: Verify Node runtime
        run: node scripts/check-node-version.mjs

      - name: Run gate (source artifacts + build + typecheck + test)
        run: npm run gate
        env:
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
