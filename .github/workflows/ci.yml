name: CI

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  pull_request:

jobs:
  gate:
    name: Gate (build + typecheck + test)
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # .nvmrc 固定 24，与 AGENTS.md 的门禁口径一致；本地最低版本见 package.json
          # 的 engines（>= 22.18）。门禁依赖 Node 原生 type stripping，否则
          # `node --test tests/**/*.test.ts` 会整片 ERR_UNKNOWN_FILE_EXTENSION。
          node-version-file: '.nvmrc'
          cache: 'npm'

      # electron 的二进制在 postinstall 时从 GitHub Releases 拉（ELECTRON_MIRROR），
      # 这一跳不走 npm 缓存、每次构建都重新下载，偶发 504（瞬时网关超时）就会红掉
      # 整条腿；与发布流程的上传步骤同款：三连重试 + 递增退避。npm ci 自身先删
      # node_modules 再装，重试是干净的。
      - name: Install dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npm ci; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::npm ci failed after 3 attempts"
              exit 1
            fi
            echo "::warning::npm ci attempt $attempt failed; retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done
        env:
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/

      - name: Verify Node runtime
        run: node scripts/check-node-version.mjs

      - name: Run gate (source artifacts + build + typecheck + test)
        run: npm run gate
        env:
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
